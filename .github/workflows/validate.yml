name: Validate Searchata plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate .
      - run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate plugins/searchata
